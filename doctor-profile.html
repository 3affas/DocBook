<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Profile</title>
    <link rel="stylesheet" href="home.css">
</head>

<body>

<!-- NAVIGATION BAR  -->
<!-- Simple navbar showing the website name and navigation links -->
<nav>
    <h2>DocBook</h2>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#doctors">Doctors</a></li>
        <li><a href="index.html#contact">Contact</a></li>
    </ul>
</nav>

<!--  PROFILE PAGE SECTION  -->
<!-- Main layout for displaying doctor profile information -->
<section class="profile-page">

    <!--  LEFT SIDE: IMAGE GALLERY  -->
    <!-- Displays doctor images dynamically in a gallery -->
    <div class="profile-left">
        <div class="gallery" id="gallery"></div>
    </div>

    <!--  RIGHT SIDE: DOCTOR INFO  -->
    <!-- Contains detailed information about the doctor -->
    <div class="profile-right">

        <!-- Doctor name -->
        <h1 id="docName"></h1>

        <!-- Doctor specialty -->
        <p class="specialty" id="docSpec"></p>

        <!-- Biography section -->
        <div class="info-box">
            <h3>Biography</h3>
            <p id="docBio"></p>
        </div>

        <!-- Location section -->
        <div class="info-box">
            <h3>Location</h3>
            <p id="docLocation"></p>
        </div>

        <!-- Contact information -->
        <div class="info-box">
            <h3>Contact</h3>
            <p>Email: <span id="docEmail"></span></p>
            <p>Phone: <span id="docPhone"></span></p>
        </div>

        <!-- Button to open booking section -->
        <button onclick="book()">Book Appointment</button>

    </div>

    <!--  BOOKING SECTION  -->
    <!-- Hidden booking form that appears when user clicks booking button -->
    <div class="booking-section" id="bookingSection" style="display:none; margin-top:20px; width:100%; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1)">

        <h3>Book Appointment</h3>

        <!-- Patient details input -->
        <input type="text" id="patientName" placeholder="Your Name" required class="form-input">
        <input type="tel" id="patientPhone" placeholder="Phone Number" required class="form-input">
        <input type="email" id="patientemail" placeholder="Email" required class="form-input">

        <!-- Appointment date selection -->
        <label for="appointmentDate" style="display: block; margin-top: 15px; margin-bottom: 5px; font-weight: 600;">Select Date:</label>
        <input type="date" id="appointmentDate" required class="form-input">

        <!-- Time slot selection -->
        <h4 style="margin-top: 20px; margin-bottom: 15px;">Select Time:</h4>
        <div class="time-slots">
            <div class="slot">10:00 AM</div>
            <div class="slot">11:00 AM</div>
            <div class="slot">12:00 PM</div>
            <div class="slot">2:00 PM</div>
            <div class="slot">3:00 PM</div>
        </div>

        <!-- Confirm booking button -->
        <button onclick="confirmBooking()" style="margin-top: 20px; padding: 12px 25px; background: #2a7de1; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">Confirm Booking</button>

        <!-- Success message after booking -->
        <p id="successMessage" style="color:green; margin-top:10px; display:none; font-weight: 600;">
            ✓ Appointment booked successfully!
        </p>

        <!-- Error message for validation -->
        <p id="errorMessage" style="color:red; margin-top:10px; display:none; font-weight: 600;"></p>

    </div>

</section>

<!-- Profile Scripts -->
<script src="profile.js"></script>

</body>
</html>
